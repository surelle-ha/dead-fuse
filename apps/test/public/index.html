<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dead Fuse Test UI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      font-size: 14px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.active {
      background: #10b981;
    }

    .status-dot.inactive {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #cbd5e1;
    }

    .config-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }

    input,
    textarea {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      transition: border-color 0.3s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.2);
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      font-size: 13px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
    }

    button.danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }

    .message-box {
      background: rgba(15, 23, 42, 0.9);
      border-left: 4px solid #3b82f6;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 4px;
      padding: 12px;
      margin-top: 15px;
      display: none;
    }

    .message-box.active {
      display: block;
    }

    .message-box.warning {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.05);
    }

    .message-box.error {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }

    .message-box.success {
      border-left-color: #10b981;
      background: rgba(16, 185, 129, 0.05);
    }

    .message-content {
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message-box {
      background: rgba(15, 23, 42, 0.9);
      border-left: 4px solid #3b82f6;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 4px;
      padding: 12px;
      margin-top: 15px;
      display: none;
    }

    .message-box.showing {
      display: block;
    }

    .message-box.warning {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.05);
    }

    .message-box.error {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }

    .message-box.locked {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }

    .message-box.readonly {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.05);
    }

    .message-box.active-state {
      border-left-color: #10b981;
      background: rgba(16, 185, 129, 0.05);
    }

    .message-content {
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .config-info {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
      margin-top: auto;
      max-height: 200px;
      overflow-y: auto;
    }

    .config-info-line {
      padding: 4px 0;
      display: flex;
      gap: 8px;
    }

    .config-label {
      color: #94a3b8;
      min-width: 70px;
    }

    .config-value {
      color: #10b981;
      font-family: "Courier New", monospace;
      word-break: break-all;
    }

    .examples {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
    }

    .example-button {
      width: 100%;
      padding: 8px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-bottom: 5px;
      transition: all 0.3s;
    }

    .example-button:hover {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.6);
    }

    .success-message {
      color: #10b981;
      font-size: 12px;
      padding: 8px;
      background: rgba(16, 185, 129, 0.1);
      border-left: 2px solid #10b981;
      margin-top: 10px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔥 Dead Fuse Test UI</h1>
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Loading...</span>
      </div>
    </header>

    <div class="layout">
      <div class="panel">
        <h2>Configuration</h2>
        <div class="config-inputs">
          <div class="input-group">
            <label>Project ID</label>
            <input type="text" id="projectId" value="ba98eadf8fdddc0d" />
          </div>
          <div class="input-group">
            <label>Master URL</label>
            <input type="text" id="master" value="ws://localhost:3000/fuse" />
          </div>
          <div class="input-group">
            <label>Token</label>
            <input type="text" id="token" value="2eed01d4cb91d04f1c57ec92a1ef80d0963bc43a1e36cf25" />
          </div>
          <div class="input-group">
            <label>Fallback Mode</label>
            <input type="text" id="fallbackMode" value="readonly" />
          </div>
        </div>

        <div class="button-group">
          <button onclick="activateDeadFuse()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
            Activate
          </button>
          <button onclick="deactivateDeadFuse()" class="secondary">Deactivate</button>
        </div>

        <div class="config-info" id="configInfo">
          <div class="config-info-line">
            <span class="config-label">Status:</span>
            <span class="config-value" id="infoStatus">Inactive</span>
          </div>
          <div class="config-info-line">
            <span class="config-label">State:</span>
            <span class="config-value" id="infoState">-</span>
          </div>
          <div class="config-info-line">
            <span class="config-label">Project:</span>
            <span class="config-value" id="infoProject">-</span>
          </div>
        </div>

        <div class="message-box" id="messageBox">
          <div class="message-content" id="messageContent"></div>
        </div>
      </div>
    </div>

    <div class="panel logs-section">
      <h2>Console Output</h2>
      <div id="logs" style="background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
      max-height: 250px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      line-height: 1.4;"></div>
      <button onclick="clearLogs()" style="background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%); margin-top: 10px; width: 100%; padding: 8px;">
        Clear
      </button>
  </div>

  <script>
    const API_BASE = "http://localhost:3001";

    async function loadStatus() {
      try {
        const response = await fetch(`${API_BASE}/api/status`);
        const data = await response.json();

        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");

        if (data.config) {
          statusDot.className = "status-dot active";
          statusText.textContent = `Active - ${data.state || "UNKNOWN"}`;
          document.getElementById("infoStatus").textContent = "Active";
          document.getElementById("infoState").textContent = data.state || "-";
          document.getElementById("infoProject").textContent = data.config.projectId || "-";
        } else {
          statusDot.className = "status-dot inactive";
          statusText.textContent = "Inactive";
          document.getElementById("infoStatus").textContent = "Inactive";
          document.getElementById("infoState").textContent = "-";
          document.getElementById("infoProject").textContent = "-";
        }

        updateLogs(data.logs);
        updateMessage(data);
      } catch (error) {
        console.error("Error loading status:", error);
      }
    }

    function updateLogs(logs) {
      const logsDiv = document.getElementById("logs");
      logsDiv.innerHTML = logs
        .map(
          (log) =>
            `<div style="padding: 4px 0; display: flex; gap: 8px;">
          <span style="font-weight: 600; width: 60px; flex-shrink: 0; color: ${
            log.type === 'error' ? '#ef4444' : log.type === 'warn' ? '#f59e0b' : '#3b82f6'
          };">[${log.type.toUpperCase()}]</span>
          <span>${log.message}</span>
        </div>`
        )
        .join("");
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    function updateMessage(data) {
      const messageBox = document.getElementById("messageBox");
      const messageContent = document.getElementById("messageContent");

      if (data.message) {
        const typeClass = data.messageType === 'active' ? 'active-state' : data.messageType || '';
        messageBox.className = `message-box showing ${typeClass}`;
        messageContent.textContent = data.message;
      } else {
        messageBox.className = "message-box";
      }
    }

    async function activateDeadFuse() {
      const projectId = document.getElementById("projectId").value;
      const master = document.getElementById("master").value;
      const token = document.getElementById("token").value;
      const fallbackMode = document.getElementById("fallbackMode").value;

      try {
        const response = await fetch(`${API_BASE}/api/activate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ projectId, master, token, fallbackMode }),
        });

        const data = await response.json();

        if (data.success) {
          loadStatus();
        } else {
          alert("❌ Error: " + data.error);
        }
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    async function deactivateDeadFuse() {
      try {
        const response = await fetch(`${API_BASE}/api/deactivate`, {
          method: "POST",
        });

        const data = await response.json();

        if (data.success) {
          alert("✅ DeadFuse deactivated!");
          loadStatus();
        } else {
          alert("❌ Error: " + data.error);
        }
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    async function clearLogs() {
      try {
        await fetch(`${API_BASE}/api/logs/clear`, { method: "POST" });
        document.getElementById("logs").innerHTML = "";
      } catch (error) {
        console.error("Error clearing logs:", error);
      }
    }

    // Load status on page load and refresh every 2 seconds
    loadStatus();
    setInterval(loadStatus, 2000);
  </script>
</body>
</html>
