<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dead Fuse Test UI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      font-size: 14px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.active {
      background: #10b981;
    }

    .status-dot.inactive {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #cbd5e1;
    }

    .config-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }

    input,
    textarea {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      transition: border-color 0.3s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 6px rgba(59, 130, 246, 0.2);
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      font-size: 13px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
    }

    button.danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }

    .code-editor {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    #codeInput {
      flex: 1;
      min-height: 300px;
      resize: none;
      font-size: 12px;
      line-height: 1.5;
    }

    .logs-panel {
      grid-column: 1 / -1;
    }

    #logs {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      font-family: "Courier New", monospace;
      line-height: 1.4;
    }

    .log-entry {
      padding: 4px 0;
      display: flex;
      gap: 8px;
    }

    .log-type {
      font-weight: 600;
      width: 60px;
      flex-shrink: 0;
    }

    .log-type.error {
      color: #ef4444;
    }

    .log-type.warn {
      color: #f59e0b;
    }

    .log-type.log {
      color: #3b82f6;
    }

    .config-info {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
      margin-top: auto;
      max-height: 200px;
      overflow-y: auto;
    }

    .config-info-line {
      padding: 4px 0;
      display: flex;
      gap: 8px;
    }

    .config-label {
      color: #94a3b8;
      min-width: 70px;
    }

    .config-value {
      color: #10b981;
      font-family: "Courier New", monospace;
      word-break: break-all;
    }

    .examples {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
    }

    .example-button {
      width: 100%;
      padding: 8px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-bottom: 5px;
      transition: all 0.3s;
    }

    .example-button:hover {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.6);
    }

    .success-message {
      color: #10b981;
      font-size: 12px;
      padding: 8px;
      background: rgba(16, 185, 129, 0.1);
      border-left: 2px solid #10b981;
      margin-top: 10px;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔥 Dead Fuse Test UI</h1>
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Loading...</span>
      </div>
    </header>

    <div class="layout">
      <div class="panel">
        <h2>Configuration</h2>
        <div class="config-inputs">
          <div class="input-group">
            <label>Project ID</label>
            <input type="text" id="projectId" value="test-project-id" />
          </div>
          <div class="input-group">
            <label>Master URL</label>
            <input type="text" id="master" value="ws://localhost:3000/fuse" />
          </div>
          <div class="input-group">
            <label>Token</label>
            <input type="text" id="token" value="test-token" />
          </div>
        </div>

        <div class="button-group">
          <button onclick="activateDeadFuse()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
            Activate
          </button>
          <button onclick="deactivateDeadFuse()" class="secondary">Deactivate</button>
        </div>

        <div class="config-info" id="configInfo">
          <div class="config-info-line">
            <span class="config-label">Status:</span>
            <span class="config-value" id="infoStatus">Inactive</span>
          </div>
          <div class="config-info-line">
            <span class="config-label">State:</span>
            <span class="config-value" id="infoState">-</span>
          </div>
          <div class="config-info-line">
            <span class="config-label">Project:</span>
            <span class="config-value" id="infoProject">-</span>
          </div>
        </div>

        <div class="examples">
          <h3 style="font-size: 12px; margin-bottom: 10px;">Example Code</h3>
          <button class="example-button" onclick="loadExample('getState')">Get Current State</button>
          <button class="example-button" onclick="loadExample('getConfig')">Get Configuration</button>
          <button class="example-button" onclick="loadExample('custom')">Custom Script</button>
        </div>
      </div>

      <div class="panel">
        <h2>Code Editor</h2>
        <div class="code-editor">
          <textarea id="codeInput" placeholder="// Write your DeadFuse code here&#10;// DeadFuse object is available&#10;&#10;const state = DeadFuse.getState();&#10;console.log('Current state:', state);"></textarea>
          <button onclick="executeCode()" style="background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);">
            ▶ Execute Code
          </button>
          <button onclick="clearLogs()" class="secondary" style="font-size: 12px;">Clear Logs</button>
        </div>
      </div>
    </div>

    <div class="panel logs-panel">
      <h2>Output Logs</h2>
      <div id="logs"></div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:3001";

    async function loadStatus() {
      try {
        const response = await fetch(`${API_BASE}/api/status`);
        const data = await response.json();

        const statusDot = document.getElementById("statusDot");
        const statusText = document.getElementById("statusText");

        if (data.config) {
          statusDot.className = "status-dot active";
          statusText.textContent = `Active - ${data.state || "UNKNOWN"}`;
          document.getElementById("infoStatus").textContent = "Active";
          document.getElementById("infoState").textContent = data.state || "-";
          document.getElementById("infoProject").textContent = data.config.projectId || "-";
        } else {
          statusDot.className = "status-dot inactive";
          statusText.textContent = "Inactive";
          document.getElementById("infoStatus").textContent = "Inactive";
          document.getElementById("infoState").textContent = "-";
          document.getElementById("infoProject").textContent = "-";
        }

        updateLogs(data.logs);
      } catch (error) {
        console.error("Error loading status:", error);
      }
    }

    function updateLogs(logs) {
      const logsDiv = document.getElementById("logs");
      logsDiv.innerHTML = logs
        .map(
          (log) =>
            `<div class="log-entry">
          <span class="log-type ${log.type}">[${log.type.toUpperCase()}]</span>
          <span>${log.message}</span>
        </div>`
        )
        .join("");
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function executeCode() {
      const code = document.getElementById("codeInput").value;

      if (!code.trim()) {
        alert("Please enter some code to execute");
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/execute`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });

        const data = await response.json();
        updateLogs(data.logs);
        loadStatus();
      } catch (error) {
        console.error("Error executing code:", error);
        alert("Error executing code: " + error.message);
      }
    }

    async function activateDeadFuse() {
      const projectId = document.getElementById("projectId").value;
      const master = document.getElementById("master").value;
      const token = document.getElementById("token").value;

      try {
        const response = await fetch(`${API_BASE}/api/activate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ projectId, master, token }),
        });

        const data = await response.json();

        if (data.success) {
          alert("✅ DeadFuse activated successfully!");
          loadStatus();
        } else {
          alert("❌ Error: " + data.error);
        }
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    async function deactivateDeadFuse() {
      try {
        const response = await fetch(`${API_BASE}/api/deactivate`, {
          method: "POST",
        });

        const data = await response.json();

        if (data.success) {
          alert("✅ DeadFuse deactivated!");
          loadStatus();
        } else {
          alert("❌ Error: " + data.error);
        }
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    async function clearLogs() {
      try {
        await fetch(`${API_BASE}/api/logs/clear`, { method: "POST" });
        document.getElementById("logs").innerHTML = "";
      } catch (error) {
        console.error("Error clearing logs:", error);
      }
    }

    function loadExample(type) {
      const examples = {
        getState: `// Get the current state of DeadFuse
const state = DeadFuse.getState();
console.log("Current state:", state);`,

        getConfig: `// Get the current configuration
const config = DeadFuse.getConfig();
console.log("Configuration:", config);`,

        custom: `// Custom script example
console.log("DeadFuse loaded successfully!");

// You can access DeadFuse here
const state = DeadFuse.getState();
const config = DeadFuse.getConfig();

console.log("State:", state);
console.log("Config:", config);`,
      };

      document.getElementById("codeInput").value = examples[type] || "";
      document.getElementById("codeInput").focus();
    }

    // Load status on page load and refresh every 2 seconds
    loadStatus();
    setInterval(loadStatus, 2000);

    // Load default example on page load
    loadExample("getState");
  </script>
</body>
</html>
